setup_commands:
  - 'python -m pip install -r requirements.txt'
  - 'python src/main.py setup'
run_commands:
  - 'python src/main.py search "How do I find previous logs from a restarting container?" --top-k 3'
  - 'python src/main.py search "How do I debug a Kubernetes Service that has no endpoints?" --top-k 3 --json'
test_commands:
  - 'python -m unittest discover -s tests -v'
  - 'python src/check_index.py'
notes: >-
  Python 3.12; CPU only. No API key, GPU, Docker, or Elasticsearch service.
  Internet is required for pip packages and the pinned approximately 24 MB MiniLM
  model download from Hugging Face. The complete 17,280-passage index is included
  as a verified snapshot; default setup does not rebuild it. Setup is repeatable
  and non-interactive. This submission performs text retrieval, not answer
  generation. See README.md for optional full source rebuild commands.
